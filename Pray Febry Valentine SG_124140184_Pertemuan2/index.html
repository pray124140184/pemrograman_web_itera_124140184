<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tugas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Dashboard saya</h1>
      <p id="stat" class="muted"></p>
    </header>

    <section class="cards">
      <div class="card card-deadline">
        <p class="label">Deadline terdekat</p>
        <p id="dl-title" class="dl-title"></p>
        <div class="dl-row">
          <span id="dl-time" class="dl-time"></span>
          <span id="dl-tag"></span>
        </div>
      </div>
      <div class="card">
        <p class="label">Kutipan hari ini</p>
        <p id="quote-text" class="quote">Memuat kutipan...</p>
        <p id="quote-author" class="muted small"></p>
      </div>
    </section>

    <section class="card">
      <form id="task-form" class="form">
        <input id="task-title" type="text" placeholder="Tulis tugas baru" autocomplete="off">
        <select id="task-category" aria-label="Kategori">
          <option value="kuliah">Kuliah</option>
          <option value="infest">INFEST</option>
          <option value="kmpa">KMPA</option>
        </select>
        <input id="task-date" type="date" aria-label="Tanggal deadline">
        <button type="submit" class="btn-primary">Tambah</button>
      </form>
      <p id="form-error" class="error"></p>

      <div id="filters" class="filters">
        <button class="chip on" data-filter="all">Semua</button>
        <button class="chip" data-filter="kuliah">Kuliah</button>
        <button class="chip" data-filter="infest">INFEST</button>
        <button class="chip" data-filter="kmpa">KMPA</button>
      </div>

      <div id="task-list"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
